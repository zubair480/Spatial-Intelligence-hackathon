<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PARTY LINE</title>
  </head>
  <body>
    <canvas id="c"></canvas>

    <div id="lobby">
      <div class="lb-half lb-past"></div>
      <div class="lb-half lb-present"></div>
      <div class="lb-seam"></div>

      <div class="lb-inner">
        <div class="lb-kicker">A two-player thriller</div>
        <h1 class="lb-title">PARTY&nbsp;LINE</h1>
        <p class="lb-tag">One house. Twenty-eight years apart.<br/>One of you is lying.</p>

        <div class="lb-cards">
          <button id="create" class="lb-card lb-card-past">
            <span class="lb-year">1998</span>
            <span class="lb-role">You are in the past</span>
            <span class="lb-cta">Start a game &rarr;</span>
            <span class="lb-note">You'll get a four-letter code for your partner.</span>
          </button>

          <div class="lb-card lb-card-present">
            <span class="lb-year">2026</span>
            <span class="lb-role">You are in the present</span>
            <div class="lb-joinrow">
              <input id="code" placeholder="CODE" maxlength="4" autocomplete="off" spellcheck="false" />
              <button id="join">Join &rarr;</button>
            </div>
            <span class="lb-note" id="err">Enter the code your partner gives you.</span>
          </div>
        </div>

        <div class="lb-foot">Open both on one screen, side by side. Watch cause and effect at the same time.</div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
